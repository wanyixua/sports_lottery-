name: Diagnose RH live NBA event response
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect RH NBA page (read-only)
        run: python scripts/inspect_rh_live.py
