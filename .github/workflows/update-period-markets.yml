name: Update NBA half and quarter markets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

# Independent from the full-game odds and Pages deployment jobs.
concurrency:
  group: nba-period-markets
  cancel-in-progress: false

jobs:
  refresh-period-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read latest game slate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          test -s odds.json
      - name: Install browser for RH collapsed contract menus
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch RH half and quarter quotes
        id: period_fetch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/update_period_markets.py --force
          else
            python scripts/update_period_markets.py
          fi
      - name: Commit ONLY period market cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -s period_markets.json
          git add period_markets.json
          if git diff --cached --quiet; then
            echo 'Period market data unchanged.'
            exit 0
          fi
          git commit -m 'Update NBA period market cache'
          # Full-game workflow may push while this job is fetching; rebase before push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Explain publication
        run: |
          echo 'Period quotes saved to period_markets.json.'
          echo 'Existing full-game Pages workflow publishes the latest repo contents independently.'
