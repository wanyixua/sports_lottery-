name: Update NBA odds cache and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nba-odds-pages
  cancel-in-progress: false
jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh NBA winner, spread and total caches
        id: refresh
        continue-on-error: true
        run: python scripts/update_odds.py
      - name: Commit updated data when changed
        if: steps.refresh.outcome == 'success'
        run: |
          if ! git diff --quiet -- odds.json spreads.json totals.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add odds.json spreads.json totals.json
            git commit -m 'Update NBA market cache'
            git push
          else
            echo 'No cache changes'
          fi
      - name: Explain preserved odds cache
        if: steps.refresh.outcome == 'failure'
        run: echo "::warning::Odds refresh failed; existing caches preserved. Publishing committed site files anyway."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
