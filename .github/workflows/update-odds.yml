name: Update NBA odds cache and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'  # every 5 minutes (minute 2,7,...57); may be delayed
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nba-odds-pages
  cancel-in-progress: false
jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update cache from configured JSON source
        env:
          ODDS_SOURCE_URL: ${{ vars.ODDS_SOURCE_URL }}
        run: python scripts/update_odds.py
      - name: Commit cache only if changed
        run: |
          if ! git diff --quiet -- odds.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add odds.json
            git commit -m 'Update NBA odds cache'
            git push
          else
            echo 'No cache changes'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
