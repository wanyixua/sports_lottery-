<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小王体彩 · NBA Odds</title>
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root {
      color-scheme: dark;
      --bg:#09111f;
      --bg2:#0e1a2f;
      --panel:rgba(10,18,34,.74);
      --panel-strong:rgba(14,23,42,.88);
      --line:rgba(255,255,255,.08);
      --soft:#9eacc8;
      --text:#eef4ff;
      --accent:#55d48f;
      --accent-2:#5ab8ff;
      --danger:#f38b8b;
      --shadow:0 18px 40px rgba(0,0,0,.26);
      --radius:24px;
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body {
      margin:0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(80,149,255,.18), transparent 22%),
        radial-gradient(circle at 82% 8%, rgba(84,212,143,.16), transparent 22%),
        radial-gradient(circle at 88% 65%, rgba(255,146,83,.14), transparent 24%),
        linear-gradient(180deg, #07101d 0%, #0b1323 42%, #0f1930 100%);
      overflow-x:hidden;
    }
    body::before, body::after {
      content:""; position:fixed; inset:auto; pointer-events:none; z-index:0;
    }
    body::before {
      top:-22vmin; right:-18vmin; width:56vmin; height:56vmin; border-radius:50%;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.06) 0 2%, transparent 2.2%),
        radial-gradient(circle at center, transparent 0 53%, rgba(255,255,255,.08) 53.4% 54.2%, transparent 54.6%),
        radial-gradient(circle at center, transparent 0 70%, rgba(255,255,255,.06) 70.4% 71%, transparent 71.4%),
        linear-gradient(135deg, rgba(255,154,84,.28), rgba(255,154,84,.05));
      filter: blur(2px);
      opacity:.7;
    }
    body::after {
      left:-10vmin; bottom:12vmin; width:42vmin; height:42vmin; border-radius:50%;
      background:
        linear-gradient(0deg, rgba(255,255,255,.03), rgba(255,255,255,.03)),
        repeating-linear-gradient(90deg, transparent 0 32px, rgba(255,255,255,.04) 32px 33px),
        linear-gradient(135deg, rgba(71,103,255,.14), rgba(91,184,255,.06));
      mask: radial-gradient(circle at center, black 0 68%, transparent 69%);
      opacity:.55;
      transform: rotate(18deg);
    }
    .app { max-width:760px; margin:0 auto; padding:20px 14px 170px; position:relative; z-index:1; }
    .hero {
      padding:18px 18px 20px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(16,26,48,.84), rgba(8,15,29,.72));
      box-shadow:var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius:28px;
      position:relative;
      overflow:hidden;
      margin-bottom:16px;
    }
    .hero::after {
      content:""; position:absolute; inset:auto -40px -48px auto; width:170px; height:170px; border-radius:50%;
      background:
        radial-gradient(circle at center, transparent 0 57%, rgba(255,255,255,.14) 57.6% 58.6%, transparent 59%),
        linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      opacity:.55;
      transform: rotate(-14deg);
    }
    .hero-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-size:30px; font-weight:900; letter-spacing:-0.03em; }
    .brand span { color:#8fa2c2; font-weight:650; }
    .status {
      display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
      background:rgba(255,255,255,.08); color:#d9e4ff; border:1px solid rgba(255,255,255,.08);
      padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700;
    }
    .status::before { content:""; width:8px; height:8px; border-radius:50%; background:#5adf95; box-shadow:0 0 12px rgba(90,223,149,.75); }
    .lucky-banner {
      margin-top:16px; padding:13px 16px; border-radius:16px;
      background:linear-gradient(105deg,rgba(255,214,131,.20),rgba(255,176,80,.10));
      border:1px solid rgba(255,213,135,.28);
      color:#ffe1a7; font-weight:850; font-size:16px;
      letter-spacing:.025em; line-height:1.5;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
    }
    .lucky-banner .sparkle { color:#ffcd70; margin-right:7px; }
    .hero h1 { margin:16px 0 8px; font-size:24px; line-height:1.15; letter-spacing:-0.03em; }
    .hero p { margin:0; color:#b6c3dd; line-height:1.65; font-size:14px; max-width:540px; }
    .summary-row { display:flex; align-items:stretch; gap:12px; margin:16px 0 18px; }
    .summary-card {
      flex:1; min-width:0; border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:14px 16px;
      background:rgba(11,19,35,.58); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow:0 10px 30px rgba(0,0,0,.16);
    }
    .summary-label { color:#90a1bf; font-size:12px; margin-bottom:7px; }
    .summary-value { font-size:21px; font-weight:850; letter-spacing:-0.03em; }
    .summary-sub { margin-top:5px; color:#aab6cb; font-size:12px; }
    #games { display:flex; flex-direction:column; gap:14px; }
    .game {
      background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:24px;
      padding:16px; box-shadow:var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      position:relative; overflow:hidden;
    }
    .game::before { content:""; position:absolute; inset:0 0 auto 0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); opacity:.5; }
    .meta { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; color:#9eb0ce; font-size:12px; }
    .league-tag { padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.06); font-size:11px; color:#d8e0ef; }
    .line { display:grid; grid-template-columns:30px minmax(0,1fr) 54px 132px; gap:10px; align-items:center; padding:8px 0; }
    .jersey { width:28px; height:32px; clip-path:polygon(25% 0,39% 10%,61% 10%,75% 0,100% 13%,87% 39%,87% 100%,13% 100%,13% 39%,0 13%); background:var(--team-color,#718096); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.18); }
    .teamname { font-weight:800; font-size:17px; letter-spacing:-0.02em; }
    .code { color:#8f9cb4; font-size:11px; margin-top:4px; }
    .record { text-align:center; color:#a5b2c8; font-size:12px; font-weight:700; }
    .odd {
      width:100%; min-height:72px; border:1px solid rgba(255,255,255,.08); border-radius:16px; cursor:pointer;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04)); color:#f7fbff;
      transition:transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      padding:8px 8px 9px;
    }
    .odd:hover:not(:disabled) { transform:translateY(-1px); border-color:rgba(90,184,255,.45); background:linear-gradient(180deg, rgba(90,184,255,.18), rgba(255,255,255,.05)); box-shadow:0 10px 18px rgba(0,0,0,.14); }
    .odd strong { display:block; font-size:20px; font-weight:900; letter-spacing:-0.03em; }
    .odd small { display:block; margin-top:5px; color:#86f0b2; font-size:11px; font-weight:800; }
    .odd.selected { border-color:rgba(90,223,149,.62); background:linear-gradient(180deg, rgba(90,223,149,.18), rgba(255,255,255,.05)); box-shadow:0 0 0 3px rgba(90,223,149,.14); }
    .odd.selected::after { content:"已选"; display:block; margin-top:5px; font-size:11px; font-weight:800; color:#aef3ca; }
    .odd:disabled { cursor:default; opacity:.58; }
    .empty-note { font-size:12px; color:#a5b3cb; line-height:1.7; }
    .note { margin-top:18px; padding:16px 18px; border-radius:20px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.06); color:#b1bfd8; font-size:12px; line-height:1.8; }
    .slip {
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:linear-gradient(180deg, rgba(10,17,31,.78), rgba(7,12,24,.94));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top:1px solid rgba(255,255,255,.08);
      box-shadow:0 -14px 40px rgba(0,0,0,.32);
    }
    .slip-inner { max-width:760px; margin:0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .slip-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    .slip-title-wrap { display:flex; flex-direction:column; gap:3px; }
    .slip-title { font-size:18px; font-weight:900; letter-spacing:-0.03em; }
    .slip-sub { color:#93a3c1; font-size:12px; }
    .clear { border:1px solid rgba(255,255,255,.08); color:#dce5f6; background:rgba(255,255,255,.06); border-radius:12px; padding:9px 12px; font-weight:800; cursor:pointer; }
    .slip-stats { display:grid; grid-template-columns: 116px repeat(4, minmax(0,1fr)); gap:10px; align-items:stretch; }
    .stake-wrap, .stat {
      padding:10px 12px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06);
      min-width:0;
    }
    .stake-wrap label, .stat small { display:block; color:#8ea1c0; font-size:11px; margin-bottom:5px; }
    .stake-wrap input { width:100%; padding:7px 9px; border-radius:10px; border:1px solid rgba(255,255,255,.10); background:rgba(4,9,18,.72); color:#fff; font-size:17px; font-weight:850; }
    .stat b { display:block; font-size:18px; font-weight:900; letter-spacing:-0.03em; }
    .positive { color:#90f0bb; }
    .choices { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
    .chip { padding:7px 10px; border-radius:999px; background:rgba(90,184,255,.14); color:#d8ebff; border:1px solid rgba(90,184,255,.22); font-size:12px; font-weight:700; }
    .choices.empty { display:block; color:#8fa0bc; font-size:12px; }
    .disclaimer { margin-top:10px; color:#7f90ac; font-size:11px; line-height:1.6; }
    button:focus-visible, input:focus-visible { outline:3px solid rgba(90,184,255,.65); outline-offset:2px; }
    @media (max-width: 700px) {
      .app { padding:16px 12px 190px; }
      .summary-row { gap:10px; }
      .brand { font-size:28px; }
      .hero h1 { font-size:22px; }
      .slip-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .stake-wrap { grid-column: span 2; }
    }
    @media (max-width: 430px) {
      .hero { padding:16px; border-radius:24px; }
      .hero-top { align-items:flex-start; flex-direction:column; }
      .summary-row { flex-direction:column; }
      .line { grid-template-columns:28px minmax(0,1fr) 42px 116px; gap:8px; }
      .teamname { font-size:16px; }
      .odd strong { font-size:18px; }
      .slip-inner { padding-left:12px; padding-right:12px; }
      .slip-title { font-size:17px; }
      .slip-stats { grid-template-columns: 1fr 1fr; }
      .stake-wrap { grid-column: span 2; }
      .meta { font-size:11px; }
    }

    /* On phones, keep the betting slip compact until opened. */
    .slip-preview { display:none; }
    @media (max-width:700px) {
      .app { padding-bottom:115px; }
      .slip-inner { padding:0 12px calc(8px + env(safe-area-inset-bottom)); }
      .slip-preview {
        display:flex; width:100%; min-height:64px; align-items:center; justify-content:space-between;
        gap:12px; padding:12px 2px 8px; border:0; background:transparent; color:var(--text);
        cursor:pointer; text-align:left;
      }
      .slip-preview-title { font-size:15px; font-weight:900; }
      .slip-preview-detail { display:block; margin-top:4px; color:#92a7c8; font-size:12px; }
      .slip-preview-right { display:flex; gap:12px; align-items:center; }
      .slip-preview-profit { color:#90f0bb; font-size:17px; font-weight:900; white-space:nowrap; }
      .slip-arrow { font-size:19px; transition: transform .15s; color:#a9bedc; }
      .slip.expanded .slip-arrow { transform:rotate(180deg); }
      .slip-body { display:none; max-height: min(68dvh, 620px); overflow-y:auto; overscroll-behavior:contain; padding-bottom:10px; }
      .slip.expanded .slip-body { display:block; }
      .slip-head { padding-top:6px; }
      .slip-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .stake-wrap { grid-column:span 2; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand">NBA <span>Odds</span></div>

      <p id="hero-sub">选择多个球队按钮，可查看理论串关倍率、总返还和净收益。</p>
    </header>

    <section class="summary-row" aria-label="概要信息">
      <div class="summary-card">
        <div class="summary-label">今日赛程</div>

        <div class="summary-sub">同一场比赛只能选择一支球队；再次点击可取消。</div>
      </div>
    </section>

    <section id="games" aria-label="NBA 比赛列表"></section>

    <section class="note" id="data-note">正在加载最新赔率数据…</section>
  </main>

  <aside class="slip" aria-label="串关计算器" id="slip">
    <div class="slip-inner">

      <div class="slip-body" id="slip-body">
      <div class="slip-head">
        <div class="slip-title-wrap">
          <div class="slip-title">串关计算器</div>
          <div class="slip-sub" id="combo-type">选择比赛</div>
        </div>
        <button class="clear" type="button" id="clear-btn">清空</button>
      </div>
      <div class="slip-stats">
        <div class="stake-wrap">
          <label for="stake">投入金额（USD）</label>
          <input id="stake" inputmode="decimal" value="10" />
        </div>
        <div class="stat"><small>已选</small><b id="pick-count">0选</b></div>
        <div class="stat"><small>理论倍率</small><b id="multiple">—</b></div>
        <div class="stat"><small>总返还</small><b id="payout">—</b></div>
        <div class="stat"><small>净利润</small><b class="positive" id="profit">—</b></div>
      </div>
      <div id="choices" class="choices empty">点击比赛中的赔率按钮选择球队（每场限选一队）</div>

      </div>
    </div>
  </aside>

        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || parts.length !== 2 || !Number.isInteger(parts[0]) || !Number.isInteger(parts[1])) return null;

        const mt = tz.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
        const offsetMin = mt ? (mt[1] === '+' ? 1 : -1) * (Number(mt[2]) * 60 + Number(mt[3] || 0)) : -480;
        const utc = new Date(Date.UTC(y,m-1,d,parts[0],parts[1]) - offsetMin * 60000);
        const partsBj = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(utc);
        const pick = t => partsBj.find(x=>x.type===t)?.value || '';
        return { month: pick('month'), day: pick('day'), hour: pick('hour'), minute: pick('minute'), text: `${pick('month')}月${pick('day')}日 ${pick('hour')}:${pick('minute')} 北京时间` };
      };
      const netProfit = (pricePercent) => stake * (100 / Number(pricePercent) - 1);
      const createTeamRow = (team, game, side) => {
        const row = document.createElement('div');
        row.className = 'line';
        const jersey = document.createElement('span');
        jersey.className = 'jersey';
        jersey.style.setProperty('--team-color', safeColor(team.color));
        const identity = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'teamname';
        name.textContent = team.nameZh || teamNames[team.code] || team.code || '待定';
        const code = document.createElement('div');
        code.className = 'code';
        code.textContent = team.code || '';
        identity.append(name, code);
        const record = document.createElement('div');
        record.className = 'record';
        record.textContent = team.record || '—';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'odd';
        button.dataset.game = game.id;
        button.dataset.side = side;
        button.dataset.price = validPrice(team.pricePercent) ? String(Number(team.pricePercent)) : '';
        const big = document.createElement('strong');
        const small = document.createElement('small');
        if (validPrice(team.pricePercent)) {
          const p = Number(team.pricePercent);
          big.textContent = (Number.isInteger(p) ? p : p.toFixed(1)) + '%';
          small.textContent = '净赚 ' + money(netProfit(p));
          button.setAttribute('aria-label', `${name.textContent} 胜，赔率 ${big.textContent}，点击选择`);
        } else {
          big.textContent = '待更新';
          small.textContent = '暂无报价';
          button.disabled = true;
        }
        button.setAttribute('aria-pressed', 'false');
        button.append(big, small);
        row.append(jersey, identity, record, button);
        return row;
      };
      const renderGames = (data) => {
        currentData = data;
        games = Array.isArray(data.games) ? data.games : [];
        const frag = document.createDocumentFragment();
        for (const game of games) {
          const card = document.createElement('article');
          card.className = 'game';
          const meta = document.createElement('div');
          meta.className = 'meta';
          const left = document.createElement('span');
          const info = getBJTDateInfo(data.date, game.startTimePT);
          left.textContent = info ? info.text : '开赛时间待定';
          const right = document.createElement('span');
          right.className = 'league-tag';
          right.textContent = 'NBA';
          meta.append(left, right);
          card.append(meta, createTeamRow(game.away || {}, game, 'away'), createTeamRow(game.home || {}, game, 'home'));
          frag.append(card);
        }
        list.replaceChildren(frag);
        const first = games[0] ? getBJTDateInfo(data.date, games[0].startTimePT) : null;
        document.getElementById('summary-date').textContent = first ? `${first.month}月${first.day}日 · 北京时间` : '北京时间';
        document.getElementById('summary-meta').textContent = `${games.length} 场比赛`;
        document.getElementById('hero-sub').textContent = first ? `${first.month}月${first.day}日赛程已加载 · 选择多个球队按钮，可查看理论串关倍率、总返还和净收益。` : '选择多个球队按钮，可查看理论串关倍率、总返还和净收益。';
        const fetched = data.capturedAt ? new Date(data.capturedAt) : null;
        const refreshed = fetched && !Number.isNaN(fetched.getTime()) ? new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}).format(fetched) + ' 北京时间' : '时间未知';
        status.textContent = String(data.source || '').includes('Robinhood public webpage') ? 'RH 公开网页缓存' : '赔率缓存';
        document.getElementById('data-note').textContent = `数据来源：${data.source || '历史缓存'}；采集时间：${refreshed}。页面展示中文队名、北京时间与理论串关收益，实际报价可能随时变化，且未计手续费、滑点与成交差异。`;
        for (const [id, side] of selected) {
          const game = games.find(x => x.id === id);
          if (!game || !validPrice(game[side]?.pricePercent)) selected.delete(id);
        }
        updateSlip();
      };
      const getPicks = () => [...selected].flatMap(([id, side]) => {
        const game = games.find(g => g.id === id);
        const team = game?.[side];
        return team && validPrice(team.pricePercent) ? [{id, side, team}] : [];
      });
      function updateSlip() {
        const picks = getPicks();
        let mult = 1;
        for (const p of picks) mult *= 100 / Number(p.team.pricePercent);
        document.getElementById('pick-count').textContent = `${picks.length}选`;
        document.getElementById('multiple').textContent = picks.length ? mult.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) + '×' : '—';
        document.getElementById('payout').textContent = picks.length ? money(stake * mult) : '—';
        document.getElementById('profit').textContent = picks.length ? money(stake * (mult - 1)) : '—';
        document.getElementById('slip-preview-count').textContent = picks.length + '选 · ' + (document.getElementById('slip').classList.contains('expanded') ? '点击收起' : '点击展开');
        document.getElementById('slip-preview-profit').textContent = '净赚 ' + (picks.length ? money(stake * (mult - 1)) : '—');
        const choices = document.getElementById('choices');
        if (!picks.length) {
          choices.className = 'choices empty';
          choices.textContent = '点击比赛中的赔率按钮选择球队（每场限选一队）';
        } else {
          choices.className = 'choices';
          choices.replaceChildren(...picks.map(p => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = p.team.nameZh || teamNames[p.team.code] || p.team.code;
            return chip;
          }));
        }
        document.getElementById('combo-type').textContent = picks.length >= 2 ? '理论串关' : (picks.length === 1 ? '单场理论收益' : '选择比赛');
        document.querySelectorAll('.odd[data-game]').forEach(el => {
          const picked = selected.get(el.dataset.game) === el.dataset.side;
          el.classList.toggle('selected', picked);
          el.setAttribute('aria-pressed', String(picked));
          if (!el.disabled) {
            const p = Number(el.dataset.price);
            el.querySelector('small').textContent = '净赚 ' + money(netProfit(p));
          }
        });
      }
      list.addEventListener('click', (ev) => {
        const btn = ev.target.closest('button.odd[data-game]');
        if (!btn || btn.disabled) return;
        const id = btn.dataset.game;
        const side = btn.dataset.side;
        if (selected.get(id) === side) selected.delete(id); else selected.set(id, side);
        updateSlip();
      });
      const slipToggle = document.getElementById('slip-toggle');
      slipToggle.addEventListener('click', () => {
        const expanded = document.getElementById('slip').classList.toggle('expanded');
        slipToggle.setAttribute('aria-expanded', String(expanded));
        document.getElementById('slip-preview-count').textContent = selected.size + '选 · ' + (expanded ? '点击收起' : '点击展开');
      });
      document.getElementById('clear-btn').addEventListener('click', () => { selected.clear(); updateSlip(); });
      stakeInput.addEventListener('input', () => {
        const n = Number(stakeInput.value);
        if (Number.isFinite(n) && n > 0) stake = n;
        updateSlip();
      });
      const fallback = JSON.parse(document.getElementById('fallback-data').textContent);
      renderGames(fallback);
      fetch('odds.json', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
        .then(data => { renderGames(data); })
        .catch(() => { status.textContent = '使用本地备用缓存'; });
    })();
  </script>
</body>
</html>
