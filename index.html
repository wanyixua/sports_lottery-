<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小王体彩 · NBA Odds</title>
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root {
      color-scheme: dark;
      --bg:#09111f;
      --bg2:#0e1a2f;
      --panel:rgba(10,18,34,.74);
      --panel-strong:rgba(14,23,42,.88);
      --line:rgba(255,255,255,.08);
      --soft:#9eacc8;
      --text:#eef4ff;
      --accent:#55d48f;
      --accent-2:#5ab8ff;
      --danger:#f38b8b;
      --shadow:0 18px 40px rgba(0,0,0,.26);
      --radius:24px;
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body {
      margin:0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(80,149,255,.18), transparent 22%),
        radial-gradient(circle at 82% 8%, rgba(84,212,143,.16), transparent 22%),
        radial-gradient(circle at 88% 65%, rgba(255,146,83,.14), transparent 24%),
        linear-gradient(180deg, #07101d 0%, #0b1323 42%, #0f1930 100%);
      overflow-x:hidden;
    }
    body::before, body::after {
      content:""; position:fixed; inset:auto; pointer-events:none; z-index:0;
    }
    body::before {
      top:-22vmin; right:-18vmin; width:56vmin; height:56vmin; border-radius:50%;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.06) 0 2%, transparent 2.2%),
        radial-gradient(circle at center, transparent 0 53%, rgba(255,255,255,.08) 53.4% 54.2%, transparent 54.6%),
        radial-gradient(circle at center, transparent 0 70%, rgba(255,255,255,.06) 70.4% 71%, transparent 71.4%),
        linear-gradient(135deg, rgba(255,154,84,.28), rgba(255,154,84,.05));
      filter: blur(2px);
      opacity:.7;
    }
    body::after {
      left:-10vmin; bottom:12vmin; width:42vmin; height:42vmin; border-radius:50%;
      background:
        linear-gradient(0deg, rgba(255,255,255,.03), rgba(255,255,255,.03)),
        repeating-linear-gradient(90deg, transparent 0 32px, rgba(255,255,255,.04) 32px 33px),
        linear-gradient(135deg, rgba(71,103,255,.14), rgba(91,184,255,.06));
      mask: radial-gradient(circle at center, black 0 68%, transparent 69%);
      opacity:.55;
      transform: rotate(18deg);
    }
    .app { max-width:760px; margin:0 auto; padding:20px 14px 170px; position:relative; z-index:1; }
    .hero {
      padding:18px 18px 20px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(16,26,48,.84), rgba(8,15,29,.72));
      box-shadow:var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius:28px;
      position:relative;
      overflow:hidden;
      margin-bottom:16px;
    }
    .hero::after {
      content:""; position:absolute; inset:auto -40px -48px auto; width:170px; height:170px; border-radius:50%;
      background:
        radial-gradient(circle at center, transparent 0 57%, rgba(255,255,255,.14) 57.6% 58.6%, transparent 59%),
        linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      opacity:.55;
      transform: rotate(-14deg);
    }
    .hero-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-size:30px; font-weight:900; letter-spacing:-0.03em; }
    .brand span { color:#8fa2c2; font-weight:650; }
    .status {
      display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
      background:rgba(255,255,255,.08); color:#d9e4ff; border:1px solid rgba(255,255,255,.08);
      padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700;
    }
    .status::before { content:""; width:8px; height:8px; border-radius:50%; background:#5adf95; box-shadow:0 0 12px rgba(90,223,149,.75); }
    .lucky-banner {
      margin-top:16px; padding:13px 16px; border-radius:16px;
      background:linear-gradient(105deg,rgba(255,214,131,.20),rgba(255,176,80,.10));
      border:1px solid rgba(255,213,135,.28);
      color:#ffe1a7; font-weight:850; font-size:16px;
      letter-spacing:.025em; line-height:1.5;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
    }
    .lucky-banner .sparkle { color:#ffcd70; margin-right:7px; }
    .hero h1 { margin:16px 0 8px; font-size:24px; line-height:1.15; letter-spacing:-0.03em; }
    .hero p { margin:0; color:#b6c3dd; line-height:1.65; font-size:14px; max-width:540px; }
    .summary-row { display:flex; align-items:stretch; gap:12px; margin:16px 0 18px; }
    .summary-card {
      flex:1; min-width:0; border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:14px 16px;
      background:rgba(11,19,35,.58); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow:0 10px 30px rgba(0,0,0,.16);
    }
    .summary-label { color:#90a1bf; font-size:12px; margin-bottom:7px; }
    .summary-value { font-size:21px; font-weight:850; letter-spacing:-0.03em; }
    .summary-sub { margin-top:5px; color:#aab6cb; font-size:12px; }
    #games { display:flex; flex-direction:column; gap:14px; }
    .game {
      background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:24px;
      padding:16px; box-shadow:var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      position:relative; overflow:hidden;
    }
    .game::before { content:""; position:absolute; inset:0 0 auto 0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); opacity:.5; }
    .meta { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; color:#9eb0ce; font-size:12px; }
    .league-tag { padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.06); font-size:11px; color:#d8e0ef; }
    .line { display:grid; grid-template-columns:30px minmax(0,1fr) 54px 132px; gap:10px; align-items:center; padding:8px 0; }
    .jersey { width:28px; height:32px; clip-path:polygon(25% 0,39% 10%,61% 10%,75% 0,100% 13%,87% 39%,87% 100%,13% 100%,13% 39%,0 13%); background:var(--team-color,#718096); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.18); }
    .teamname { font-weight:800; font-size:17px; letter-spacing:-0.02em; }
    .code { color:#8f9cb4; font-size:11px; margin-top:4px; }
    .record { text-align:center; color:#a5b2c8; font-size:12px; font-weight:700; }
    .odd {
      width:100%; min-height:72px; border:1px solid rgba(255,255,255,.08); border-radius:16px; cursor:pointer;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04)); color:#f7fbff;
      transition:transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      padding:8px 8px 9px;
    }
    .odd:hover:not(:disabled) { transform:translateY(-1px); border-color:rgba(90,184,255,.45); background:linear-gradient(180deg, rgba(90,184,255,.18), rgba(255,255,255,.05)); box-shadow:0 10px 18px rgba(0,0,0,.14); }
    .odd strong { display:block; font-size:20px; font-weight:900; letter-spacing:-0.03em; }
    .odd small { display:block; margin-top:5px; color:#86f0b2; font-size:11px; font-weight:800; }
    .odd.selected { border-color:rgba(90,223,149,.62); background:linear-gradient(180deg, rgba(90,223,149,.18), rgba(255,255,255,.05)); box-shadow:0 0 0 3px rgba(90,223,149,.14); }
    .odd.selected::after { content:"已选"; display:block; margin-top:5px; font-size:11px; font-weight:800; color:#aef3ca; }
    .odd:disabled { cursor:default; opacity:.58; }
    .empty-note { font-size:12px; color:#a5b3cb; line-height:1.7; }
    .note { margin-top:18px; padding:16px 18px; border-radius:20px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.06); color:#b1bfd8; font-size:12px; line-height:1.8; }
    .slip {
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:linear-gradient(180deg, rgba(10,17,31,.78), rgba(7,12,24,.94));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top:1px solid rgba(255,255,255,.08);
      box-shadow:0 -14px 40px rgba(0,0,0,.32);
    }
    .slip-inner { max-width:760px; margin:0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .slip-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    .slip-title-wrap { display:flex; flex-direction:column; gap:3px; }
    .slip-title { font-size:18px; font-weight:900; letter-spacing:-0.03em; }
    .slip-sub { color:#93a3c1; font-size:12px; }
    .clear { border:1px solid rgba(255,255,255,.08); color:#dce5f6; background:rgba(255,255,255,.06); border-radius:12px; padding:9px 12px; font-weight:800; cursor:pointer; }
    .slip-stats { display:grid; grid-template-columns: 116px repeat(4, minmax(0,1fr)); gap:10px; align-items:stretch; }
    .stake-wrap, .stat {
      padding:10px 12px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06);
      min-width:0;
    }
    .stake-wrap label, .stat small { display:block; color:#8ea1c0; font-size:11px; margin-bottom:5px; }
    .stake-wrap input { width:100%; padding:7px 9px; border-radius:10px; border:1px solid rgba(255,255,255,.10); background:rgba(4,9,18,.72); color:#fff; font-size:17px; font-weight:850; }
    .stat b { display:block; font-size:18px; font-weight:900; letter-spacing:-0.03em; }
    .positive { color:#90f0bb; }
    .choices { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
    .chip { padding:7px 10px; border-radius:999px; background:rgba(90,184,255,.14); color:#d8ebff; border:1px solid rgba(90,184,255,.22); font-size:12px; font-weight:700; }
    .choices.empty { display:block; color:#8fa0bc; font-size:12px; }
    .disclaimer { margin-top:10px; color:#7f90ac; font-size:11px; line-height:1.6; }
    button:focus-visible, input:focus-visible { outline:3px solid rgba(90,184,255,.65); outline-offset:2px; }
    @media (max-width: 700px) {
      .app { padding:16px 12px 190px; }
      .summary-row { gap:10px; }
      .brand { font-size:28px; }
      .hero h1 { font-size:22px; }
      .slip-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .stake-wrap { grid-column: span 2; }
    }
    @media (max-width: 430px) {
      .hero { padding:16px; border-radius:24px; }
      .hero-top { align-items:flex-start; flex-direction:column; }
      .summary-row { flex-direction:column; }
      .line { grid-template-columns:28px minmax(0,1fr) 42px 116px; gap:8px; }
      .teamname { font-size:16px; }
      .odd strong { font-size:18px; }
      .slip-inner { padding-left:12px; padding-right:12px; }
      .slip-title { font-size:17px; }
      .slip-stats { grid-template-columns: 1fr 1fr; }
      .stake-wrap { grid-column: span 2; }
      .meta { font-size:11px; }
    }

    /* On phones, keep the betting slip compact until opened. */
    .slip-preview { display:none; }
    @media (max-width:700px) {
      .app { padding-bottom:115px; }
      .slip-inner { padding:0 12px calc(8px + env(safe-area-inset-bottom)); }
      .slip-preview {
        display:flex; width:100%; min-height:64px; align-items:center; justify-content:space-between;
        gap:12px; padding:12px 2px 8px; border:0; background:transparent; color:var(--text);
        cursor:pointer; text-align:left;
      }
      .slip-preview-title { font-size:15px; font-weight:900; }
      .slip-preview-detail { display:block; margin-top:4px; color:#92a7c8; font-size:12px; }
      .slip-preview-right { display:flex; gap:12px; align-items:center; }
      .slip-preview-profit { color:#90f0bb; font-size:17px; font-weight:900; white-space:nowrap; }
      .slip-arrow { font-size:19px; transition: transform .15s; color:#a9bedc; }
      .slip.expanded .slip-arrow { transform:rotate(180deg); }
      .slip-body { display:none; max-height: min(68dvh, 620px); overflow-y:auto; overscroll-behavior:contain; padding-bottom:10px; }
      .slip.expanded .slip-body { display:block; }
      .slip-head { padding-top:6px; }
      .slip-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .stake-wrap { grid-column:span 2; }
    }
  /* NBA spreads feature; reuses the existing premium dark styling. */
.matchup{font-size:15px;font-weight:800;letter-spacing:.01em;color:#e5edf9;margin:-1px 0 12px;}
.market-tabs{display:flex;gap:7px;margin:1px 0 13px;background:rgba(4,10,20,.43);padding:5px;border:1px solid rgba(255,255,255,.06);border-radius:15px;}
.market-tab{flex:1;border:0;background:transparent;color:#9baecb;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:800;cursor:pointer;}
.market-tab.active{background:#223653;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);}
.spread-controls{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px;}
.filter-chip{border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);color:#c3d2e8;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;}
.filter-chip.active{background:rgba(86,190,255,.19);border-color:rgba(86,190,255,.5);color:#e5f6ff;}
.spread-count{font-size:11px;color:#96a9c5;margin:2px 0 10px;line-height:1.55;}

.spread-ident{min-width:0;flex:1;}
.spread-title{font-weight:800;font-size:15px;color:#edf5ff;}
.spread-caption{font-size:11px;color:#a0b1cb;margin-top:5px;}
.spread-odd{width:123px;flex-shrink:0;min-height:59px;border-radius:12px;padding:5px;}
.spread-odd strong{font-size:17px;}.spread-odd small{font-size:10px;}
.spread-more{display:block;width:100%;margin-top:10px;padding:12px 9px;border:1px solid rgba(104,180,255,.27);border-radius:12px;background:rgba(104,180,255,.09);color:#d3eaff;font-size:13px;font-weight:800;cursor:pointer;}
.spread-empty{font-size:12px;color:#b2c0d9;line-height:1.7;padding:15px;background:rgba(255,255,255,.035);border-radius:13px;}
@media(max-width:430px){.spread-row{gap:8px;padding:8px}.spread-odd{width:112px}.spread-title{font-size:14px}.spread-caption{font-size:10px}}


.total-row{padding:10px;border:1px solid rgba(255,255,255,.065);background:rgba(255,255,255,.035);border-radius:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;}
.total-line{flex:0 0 65px;color:#f1f6ff;font-weight:850;font-size:15px;}
.total-choices{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0;}
.total-odd{width:100%;min-width:0;min-height:66px;padding:6px 4px;}
.total-odd strong{font-size:17px}.total-odd small{font-size:10px;}
.total-odd::before{content:attr(data-side);display:block;font-weight:850;font-size:12px;color:#b6cce8;margin-bottom:1px;}
@media(max-width:420px){.total-row{gap:7px;padding:7px}.total-line{flex-basis:57px;font-size:13px}.total-choices{gap:5px}.total-odd strong{font-size:15px}.total-odd small{font-size:9px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand">NBA <span>Odds</span></div>
        <span class="status" id="data-status">RH 赔率缓存</span>
      </div>
      <div class="lucky-banner"><span class="sparkle">✦</span>小王体彩 · 祝王老板发大财！<span class="sparkle"> ✦</span></div>
      <h1>北京时间 NBA 比赛赔率</h1>
      <p id="hero-sub">选择多个球队按钮，可查看理论串关倍率、总返还和净收益。</p>
    </header>

    <section class="summary-row" aria-label="概要信息">
      <div class="summary-card">
        <div class="summary-label">今日赛程</div>
        <div class="summary-value" id="summary-date">北京时间加载中…</div>
        <div class="summary-sub" id="summary-meta">14 场比赛</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">使用说明</div>
        <div class="summary-value" style="font-size:18px">点击赔率按钮选串</div>
        <div class="summary-sub">同场限选一项；胜负、让分、大小球可混串。</div>
      </div>
    </section>

    <section id="games" aria-label="NBA 比赛列表"></section>

    <section class="note" id="data-note">正在加载最新赔率数据…</section>
  </main>

  <aside class="slip" aria-label="串关计算器" id="slip">
    <div class="slip-inner">
      <button class="slip-preview" id="slip-toggle" type="button" aria-expanded="false" aria-controls="slip-body">
        <span><span class="slip-preview-title">串关计算器</span><span class="slip-preview-detail" id="slip-preview-count">0选 · 点击展开</span></span>
        <span class="slip-preview-right"><span class="slip-preview-profit" id="slip-preview-profit">净赚 —</span><span class="slip-arrow">⌃</span></span>
      </button>
      <div class="slip-body" id="slip-body">
      <div class="slip-head">
        <div class="slip-title-wrap">
          <div class="slip-title">串关计算器</div>
          <div class="slip-sub" id="combo-type">选择比赛</div>
        </div>
        <button class="clear" type="button" id="clear-btn">清空</button>
      </div>
      <div class="slip-stats">
        <div class="stake-wrap">
          <label for="stake">投入金额（USD）</label>
          <input id="stake" inputmode="decimal" value="10" />
        </div>
        <div class="stat"><small>已选</small><b id="pick-count">0选</b></div>
        <div class="stat"><small>理论倍率</small><b id="multiple">—</b></div>
        <div class="stat"><small>总返还</small><b id="payout">—</b></div>
        <div class="stat"><small>净利润</small><b class="positive" id="profit">—</b></div>
      </div>
      <div id="choices" class="choices empty">点击赔率按钮选串（每场限选一个盘口）</div>
      <div class="disclaimer">说明：这里显示的是根据单队买入价格计算的理论串关收益，不等于 Robinhood 实际 Combo 报价；未计手续费、滑点与成交差异。</div>
      </div>
    </div>
  </aside>

}},{"id":"2026-11-04-MIN-HOU","startTimePT":"17:30","away":{"code":"MIN","nameZh":"森林狼","record":"","color":"#476c88","pricePercent":null},"home":{"code":"HOU","nameZh":"火箭","record":"","color":"#476c88","pricePercent":null}},{"id":"2026-11-04-TOR-DEN","startTimePT":"18:00","away":{"code":"TOR","nameZh":"猛龙","record":"","color":"#476c88","pricePercent":null},"home":{"code":"DEN","nameZh":"掘金","record":"","color":"#476c88","pricePercent":null}},{"id":"2026-11-04-POR-PHX","startTimePT":"18:00","away":{"code":"POR","nameZh":"开拓者","record":"","color":"#476c88","pricePercent":null},"home":{"code":"PHX","nameZh":"太阳","record":"","color":"#476c88","pricePercent":null}},{"id":"2026-11-04-DAL-SAS","startTimePT":"18:30","away":{"code":"DAL","nameZh":"独行侠","record":"","color":"#476c88","pricePercent":null},"home":{"code":"SAS","nameZh":"马刺","record":"","color":"#476c88","pricePercent":null}},{"id":"2026-11-04-LAL-SAC","startTimePT":"19:00","away":{"code":"LAL","nameZh":"湖人","record":"","color":"#476c88","pricePercent":null},"home":{"code":"SAC","nameZh":"国王","record":"","color":"#476c88","pricePercent":null}},{"id":"2026-11-04-MIA-LAC","startTimePT":"19:30","away":{"code":"MIA","nameZh":"热火","record":"","color":"#476c88","pricePercent":null},"home":{"code":"LAC","nameZh":"快船","record":"","color":"#476c88","pricePercent":null}}]}</script>
  <script>
(() => {
  'use strict';
  const list = document.getElementById('games');
  const status = document.getElementById('data-status');
  const stakeInput = document.getElementById('stake');
  const selected = new Map(); // gameId -> { kind, team, label, pricePercent, contractId }
  const states = new Map();   // gameId -> {tab, showAll, filter}
  const teamNames = {ATL:'老鹰',BOS:'凯尔特人',BKN:'篮网',CHA:'黄蜂',CHI:'公牛',CLE:'骑士',DAL:'独行侠',DEN:'掘金',DET:'活塞',GSW:'勇士',HOU:'火箭',IND:'步行者',LAC:'快船',LAL:'湖人',MEM:'灰熊',MIA:'热火',MIL:'雄鹿',MIN:'森林狼',NOP:'鹈鹕',NYK:'尼克斯',OKC:'雷霆',ORL:'魔术',PHI:'76人',PHX:'太阳',POR:'开拓者',SAC:'国王',SAS:'马刺',TOR:'猛龙',UTA:'爵士',WAS:'奇才'};
  const money = x => Number.isFinite(x) ? '$' + x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
  const validPrice = p => p !== null && p !== undefined && p !== '' && Number.isFinite(Number(p)) && Number(p)>0 && Number(p)<=100;
  const safeColor = c => /^#[0-9a-f]{6}$/i.test(c||'') ? c : '#64748b';
  const fmt = n => Number.isInteger(n) ? String(n) : Number(n).toFixed(1);
  let odds = JSON.parse(document.getElementById('fallback-data').textContent);
  let spreads = null;
  let totals = null;
  let stake = 10;
  const netProfit = p => stake * (100 / Number(p) - 1);
  const getBJ = (date, time) => {
    const [y,m,d] = date.split('-').map(Number);
    const [h,min] = time.split(':').map(Number);
    if (![y,m,d,h,min].every(Number.isFinite)) return '开赛时间待定';
    const offsetParts = new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',timeZoneName:'shortOffset',hour:'2-digit'}).formatToParts(new Date(Date.UTC(y,m-1,d,12)));
    const offset = offsetParts.find(x=>x.type==='timeZoneName')?.value || 'GMT-8';
    const mt = offset.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
    const mins = mt ? (mt[1]==='+'?1:-1)*(Number(mt[2])*60+Number(mt[3]||0)) : -480;
    const utc = new Date(Date.UTC(y,m-1,d,h,min) - mins*60000);
    return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(utc) + ' 北京时间';
  };
  function rowButton(label, price, gameId, kind, team, contractId, className='odd') {
    const b=document.createElement('button');b.type='button';b.className=className;
    b.dataset.game=gameId;b.dataset.kind=kind;b.dataset.team=team;b.dataset.contract=contractId;
    b.dataset.price=validPrice(price)?String(price):'';b.dataset.label=label;
    const strong=document.createElement('strong'); const small=document.createElement('small');
    if(validPrice(price)){strong.textContent=fmt(Number(price))+'%';small.textContent='净赚 '+money(netProfit(price));}
    else{strong.textContent='待报价';small.textContent='暂无买入价';b.disabled=true;}
    b.append(strong,small); b.setAttribute('aria-label',label+'，'+strong.textContent);
    b.setAttribute('aria-pressed','false');return b;
  }
  function createWinner(game, side) {
    const team=game[side]||{};
    const code=team.code||'';
    const row=document.createElement('div');row.className='line';
    const jersey=document.createElement('span');jersey.className='jersey';jersey.style.setProperty('--team-color',safeColor(team.color));
    const identity=document.createElement('div');identity.innerHTML='';
    const name=document.createElement('div');name.className='teamname';name.textContent=team.nameZh||teamNames[code]||code;
    const abbr=document.createElement('div');abbr.className='code';abbr.textContent=code;identity.append(name,abbr);
    const record=document.createElement('div');record.className='record';record.textContent=team.record||'—';
    const btn=rowButton((team.nameZh||teamNames[code]||code)+'胜',team.pricePercent,game.id,'moneyline',code,'winner:'+code);
    row.append(jersey,identity,record,btn);return row;
  }
  const spreadByGame=id=>spreads?.date===odds?.date ? spreads.games.find(x=>x.id===id)?.lines||[] : [];
  const totalByGame=id=>totals?.date===odds?.date ? totals.games.find(x=>x.id===id)?.lines||[] : [];
  function makeTotalRows(game, wrapper){
    wrapper.replaceChildren();
    const lines=totalByGame(game.id);
    if(!lines.length){const el=document.createElement('div');el.className='spread-empty';el.textContent='这场比赛暂无大小球数据，请检查 totals.json 是否更新。';wrapper.append(el);return;}
    const side=states.get(game.id)||{tab:'moneyline',showAll:false,filter:'ALL'};
    const items=lines.slice().sort((a,b)=>a.points-b.points);
    const picked=selected.get(game.id);
    // Start with mainstream lines (ask closest to 50%). Show every line when expanded.
    const best=items.slice().filter(x=>validPrice(x.overPricePercent)||validPrice(x.underPricePercent))
      .sort((a,b)=>Math.min(Math.abs((a.overPricePercent??0)-50),Math.abs((a.underPricePercent??0)-50))-
                       Math.min(Math.abs((b.overPricePercent??0)-50),Math.abs((b.underPricePercent??0)-50))).slice(0,5);
    const ids=new Set(best.map(x=>x.id));
    if(picked?.kind==='total')ids.add(picked.contractId);
    const visible=side.showAll?items:items.filter(x=>ids.has(x.id));
    const count=document.createElement('div');count.className='spread-count';count.textContent=`${visible.length}/${items.length} 条总分线 · 包含加时赛 · 大球与小球分别按 RH YES/NO 买入价计算`;wrapper.append(count);
    const rows=document.createElement('div');rows.className='spread-rows';
    for(const x of visible){
      const row=document.createElement('div');row.className='total-row';
      const label=document.createElement('div');label.className='total-line';label.textContent=fmt(x.points)+' 分';
      const both=document.createElement('div');both.className='total-choices';
      for(const [type,text,price] of [['over','大球',x.overPricePercent],['under','小球',x.underPricePercent]]){
        const btn=rowButton(text+' '+fmt(x.points),price,game.id,'total',type,x.id+':'+type,'odd total-odd');
        // Keep original contract ID separately, used when fresh cache arrives.
        btn.dataset.contract=x.id+':'+type;btn.dataset.side=text;
        both.append(btn);
      }
      row.append(label,both);rows.append(row);
    }
    wrapper.append(rows);
    const more=document.createElement('button');more.className='spread-more';more.type='button';more.textContent=side.showAll?'收起，仅显示主流总分线 ↑':`展开全部 ${items.length} 条总分线 ↓`;
    more.addEventListener('click',()=>{side.showAll=!side.showAll;states.set(game.id,side);makeTotalRows(game,wrapper);});wrapper.append(more);
    syncButtons();
  }
  function makeSpreadRows(game, wrapper) {
    wrapper.replaceChildren();
    const lines=spreadByGame(game.id);
    if(!lines.length){const empty=document.createElement('div');empty.className='spread-empty';empty.textContent='这场比赛暂无让分数据，请检查 spreads.json 是否已更新。';wrapper.append(empty);return;}
    const side=states.get(game.id)||{tab:'moneyline',showAll:false,filter:'ALL'};
    const sorted=lines.filter(x=>side.filter==='ALL'||x.team===side.filter)
      .sort((a,b)=>a.team.localeCompare(b.team)||a.margin-b.margin);
    const picked=selected.get(game.id);
    const highlightedIds=new Set();
    for(const code of [game.away.code,game.home.code]){
      const closest=sorted.filter(x=>x.team===code&&validPrice(x.pricePercent))
        .sort((a,b)=>Math.abs(a.pricePercent-50)-Math.abs(b.pricePercent-50));
      closest.slice(0,3).forEach(x=>highlightedIds.add(x.id));
    }
    const visible=side.showAll?sorted:sorted.filter(x=>highlightedIds.has(x.id)||picked?.contractId===x.id).sort((a,b)=>a.team.localeCompare(b.team)||a.margin-b.margin);
    const controls=document.createElement('div');controls.className='spread-controls';
    for(const [text,team] of [['全部','ALL'],[teamNames[game.away.code]||game.away.code,game.away.code],[teamNames[game.home.code]||game.home.code,game.home.code]]){
      const btn=document.createElement('button');btn.type='button';btn.textContent=text;btn.className='filter-chip'+(side.filter===team?' active':'');
      btn.addEventListener('click',()=>{side.filter=team;states.set(game.id,side);makeSpreadRows(game,wrapper);});controls.append(btn);
    }
    wrapper.append(controls);
    const count=document.createElement('div');count.className='spread-count';count.textContent=`${visible.length}/${sorted.length} 条盘口 · 让分表示球队至少赢过指定分差`;wrapper.append(count);
    const rows=document.createElement('div');rows.className='spread-rows';
    for(const x of visible){
      const row=document.createElement('div');row.className='spread-row';
      const ident=document.createElement('div');ident.className='spread-ident';
      const name=document.createElement('div');name.className='spread-title';name.textContent=(x.teamNameZh||teamNames[x.team]||x.team)+' -'+fmt(x.margin);
      const sub=document.createElement('div');sub.className='spread-caption';sub.textContent=`${x.team} 赢超过 ${fmt(x.margin)} 分`;
      ident.append(name,sub);
      const btn=rowButton((x.teamNameZh||teamNames[x.team]||x.team)+' -'+fmt(x.margin),x.pricePercent,game.id,'spread',x.team,x.id,'odd spread-odd');
      row.append(ident,btn);rows.append(row);
    }
    wrapper.append(rows);
    if(!side.showAll){const more=document.createElement('button');more.className='spread-more';more.type='button';more.textContent=`展开全部 ${sorted.length} 条让分盘口 ↓`;more.addEventListener('click',()=>{side.showAll=true;states.set(game.id,side);makeSpreadRows(game,wrapper);});wrapper.append(more);}
    else{const less=document.createElement('button');less.className='spread-more';less.type='button';less.textContent='收起，仅显示主流盘口 ↑';less.addEventListener('click',()=>{side.showAll=false;states.set(game.id,side);makeSpreadRows(game,wrapper);});wrapper.append(less);}
    syncButtons();
  }
  function render() {
    const frag=document.createDocumentFragment();
    for(const game of (odds.games||[])){
      if(!states.has(game.id)) states.set(game.id,{tab:'moneyline',showAll:false,filter:'ALL'});
      const state=states.get(game.id);
      const card=document.createElement('article');card.className='game';
      const meta=document.createElement('div');meta.className='meta';
      const left=document.createElement('span');left.textContent=getBJ(odds.date,game.startTimePT);
      const right=document.createElement('span');right.className='league-tag';right.textContent='NBA';meta.append(left,right);card.append(meta);
      const title=document.createElement('div');title.className='matchup';title.textContent=(game.away.nameZh||teamNames[game.away.code]||game.away.code)+' vs '+(game.home.nameZh||teamNames[game.home.code]||game.home.code);
      card.append(title);
      const tabs=document.createElement('div');tabs.className='market-tabs';
      const content=document.createElement('div');
      const drawContent=()=>{
        content.replaceChildren();
        if(state.tab==='moneyline'){content.append(createWinner(game,'away'),createWinner(game,'home'));}
        else if(state.tab==='spread'){makeSpreadRows(game,content);}
        else {makeTotalRows(game,content);}
        syncButtons();
      };
      for(const [label,key] of [['胜负','moneyline'],['让分','spread'],['大小球','total']]){
        const t=document.createElement('button');t.type='button';t.className='market-tab'+(state.tab===key?' active':'');t.textContent=label;
        t.addEventListener('click',()=>{state.tab=key;states.set(game.id,state);tabs.querySelectorAll('.market-tab').forEach(b=>b.classList.toggle('active',b===t));drawContent();});tabs.append(t);
      }
      card.append(tabs,content);drawContent();frag.append(card);
    }
    list.replaceChildren(frag);
    const first=odds.games?.[0];const bj=first?getBJ(odds.date,first.startTimePT):'';
    const date=(bj.match(/\d+月\d+日/)||[])[0]||odds.date;
    document.getElementById('summary-date').textContent=date+' · 北京时间';
    document.getElementById('summary-meta').textContent=`${odds.games.length} 场比赛`;
    document.getElementById('hero-sub').textContent='胜负、让分、大小球都能选串，每场比赛限选一个盘口。';
    status.textContent=totals?.date===odds.date?'RH 三种盘口缓存':'RH 胜负 / 让分缓存';
    const count=spreads?.date===odds.date?spreads.games.reduce((s,g)=>s+g.lines.length,0):0;
    const fmtDate=s=>{const dt=new Date(s);return isNaN(dt.getTime())?'未知':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(dt);};
    const totalCount=totals?.date===odds.date?totals.games.reduce((s,g)=>s+g.lines.length,0):0;
    document.getElementById('data-note').textContent=`RH 公开网页缓存（非官方 API） · 胜负：${fmtDate(odds.capturedAt)} · 让分：${spreads?.date===odds.date?fmtDate(spreads.capturedAt):'未获得'}（${count} 条） · 大小球：${totals?.date===odds.date?fmtDate(totals.capturedAt):'未获得'}（${totalCount} 条总分线）。胜负/让分按 YES 买入价，大小球按 Over YES / Under NO 实际买入价。串关为理论独立倍率相乘，不等于 RH Combo 实际报价，未计费用和滑点。`;
    updateSlip();
  }
  function syncButtons(){
    for(const el of document.querySelectorAll('.odd[data-game]')){
      const pick=selected.get(el.dataset.game);
      const isPicked=!!pick&&pick.kind===el.dataset.kind&&pick.contractId===el.dataset.contract;
      el.classList.toggle('selected',isPicked);el.setAttribute('aria-pressed',String(isPicked));
      if(!el.disabled) el.querySelector('small').textContent='净赚 '+money(netProfit(Number(el.dataset.price)));
    }
  }
  function updateSlip(){
    const picks=[...selected.values()];let mult=1;
    for(const p of picks) mult*=100/Number(p.pricePercent);
    document.getElementById('pick-count').textContent=picks.length+'选';
    document.getElementById('multiple').textContent=picks.length?mult.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'×':'—';
    document.getElementById('payout').textContent=picks.length?money(stake*mult):'—';
    document.getElementById('profit').textContent=picks.length?money(stake*(mult-1)):'—';
    document.getElementById('slip-preview-count').textContent=picks.length+'选 · '+(document.getElementById('slip').classList.contains('expanded')?'点击收起':'点击展开');
    document.getElementById('slip-preview-profit').textContent='净赚 '+(picks.length?money(stake*(mult-1)):'—');
    const choices=document.getElementById('choices');
    choices.replaceChildren();
    if(!picks.length){choices.className='choices empty';choices.textContent='选择胜负、让分或大小球盘口，每场限选一个';}
    else {choices.className='choices';for(const p of picks){const chip=document.createElement('span');chip.className='chip';chip.textContent=p.label+' · '+fmt(p.pricePercent)+'%';choices.append(chip);}}
    document.getElementById('combo-type').textContent=picks.length>=2?'混合盘口理论串关':picks.length===1?'单场理论收益':'选择比赛';
    syncButtons();
  }
  list.addEventListener('click',ev=>{
    const b=ev.target.closest('button.odd[data-game]');if(!b||b.disabled)return;
    const gameId=b.dataset.game;
    const prev=selected.get(gameId);
    if(prev?.contractId===b.dataset.contract&&prev.kind===b.dataset.kind) selected.delete(gameId);
    else selected.set(gameId,{gameId,kind:b.dataset.kind,team:b.dataset.team,label:b.dataset.label,contractId:b.dataset.contract,pricePercent:Number(b.dataset.price)});
    updateSlip();
  });
  document.getElementById('slip-toggle').addEventListener('click',()=>{
    const expanded=document.getElementById('slip').classList.toggle('expanded');
    document.getElementById('slip-toggle').setAttribute('aria-expanded',String(expanded));updateSlip();
  });
  document.getElementById('clear-btn').addEventListener('click',()=>{selected.clear();updateSlip();});
  stakeInput.addEventListener('input',()=>{const n=Number(stakeInput.value);if(Number.isFinite(n)&&n>0)stake=n;updateSlip();});
  render();
  Promise.allSettled([
    fetch('odds.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(Error('odds HTTP '+r.status))),
    fetch('spreads.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(Error('spreads HTTP '+r.status))),
    fetch('totals.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(Error('totals HTTP '+r.status)))
  ]).then(([a,b,c])=>{
    if(a.status==='fulfilled'&&Array.isArray(a.value.games)) odds=a.value;
    if(b.status==='fulfilled'&&Array.isArray(b.value.games)) spreads=b.value;
    if(c.status==='fulfilled'&&Array.isArray(c.value.games)) totals=c.value;
    // Remove selections whose price no longer exists in the current source.
    const gameIds=new Set((odds.games||[]).map(g=>g.id));
    for(const [id,pick] of selected){
      if(!gameIds.has(id)){selected.delete(id);continue;}
      if(pick.kind==='spread'){
        const x=spreadByGame(id).find(line=>line.id===pick.contractId);
        if(!x||!validPrice(x.pricePercent))selected.delete(id);
        else pick.pricePercent=x.pricePercent;
      } else if(pick.kind==='total'){
        const originalId=pick.contractId.slice(0,-(pick.team.length+1));
        const x=totalByGame(id).find(line=>line.id===originalId);
        const p=x?.[pick.team==='over'?'overPricePercent':'underPricePercent'];
        if(!validPrice(p))selected.delete(id);
        else pick.pricePercent=p;
      } else {
        const g=odds.games.find(x=>x.id===id); const t=[g.away,g.home].find(x=>x.code===pick.team);
        if(!t||!validPrice(t.pricePercent))selected.delete(id);
        else pick.pricePercent=t.pricePercent;
      }
    }
    render();
  });
})();

  </script>
